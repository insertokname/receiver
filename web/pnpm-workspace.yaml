# web/ is its own pnpm workspace, independent of the Signal Desktop workspace at
# the repository root (whose package.json and lockfile stay untouched).

saveExact: true
blockExoticSubdeps: true
verifyStoreIntegrity: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
strictDepBuilds: true
allowBuilds:
  'protobufjs': false # postinstall only checks its CLI deps; not needed for tests
patchedDependencies:
  '@emnapi/runtime@1.11.3': patches/@emnapi__runtime@1.11.3.patch
