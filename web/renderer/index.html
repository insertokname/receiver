<!-- Desktop's background.html for the browser: same markup, static asset
     paths instead of asset://, and the inline scripts moved to app.js. -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
            script-src 'self' 'wasm-unsafe-eval';
            style-src 'self' 'unsafe-inline';
            font-src 'self';
            img-src 'self' blob: data:;
            media-src 'self' blob:;
            connect-src 'self' wss://snowflake.torproject.net https://snowflake-broker.torproject.net;
            worker-src 'self';
            child-src 'self';
            frame-src 'none';
            object-src 'none';
            base-uri 'none';
            form-action 'none';"
    />
    <meta name="referrer" content="no-referrer" />
    <title>receiver</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="preload" href="fonts/inter-v3.19/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-v3.19/Inter-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/inter-v3.19/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/signal-symbols/SignalSymbolsVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link href="stylesheets/quill.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/manifest.css" rel="stylesheet" type="text/css" />
    <link href="stylesheets/tailwind.css" rel="stylesheet" type="text/css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body class="overflow-hidden">
    <!-- Match ts/components/App.tsx -->
    <div id="app-container">
      <div class="app-loading-screen app-loading-screen--before-app-load">
        <div class="module-title-bar-drag-area"></div>

        <div
          class="module-splash-screen__logo module-splash-screen__logo--128"
        ></div>
        <div class="dot-container">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="message-placeholder"></div>
      </div>
    </div>
  </body>
</html>
