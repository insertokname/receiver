# SPDX-License-Identifier: AGPL-3.0-only
#
# Builds the static web app in web/ and deploys it to GitHub Pages
# (https://receiver.insertokname.com/), then checks the live site.
# Runs daily as well, so the Tor directory snapshot shipped with the site
# stays fresh.

name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages
  cancel-in-progress: false

env:
  WASM_PACK_VERSION: 0.15.0
  WASM_PACK_SHA256: c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
  BINARYEN_VERSION: '132'
  BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
  CLANG_VERSION: '18'
  LIVE_URL: https://receiver.insertokname.com/

jobs:
  # libsignal (web/libsignal/libsignal) compiled to WebAssembly, plus
  # libsignal's own TypeScript tests against it. The output only depends on
  # the submodule revision and the build files, so it is cached as a whole
  # and the daily runs don't rebuild it.
  libsignal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the libsignal submodule
        run: git submodule update --init --depth 1 web/libsignal/libsignal

      - id: libsignal-rev
        run: echo "rev=$(git -C web/libsignal/libsignal rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: libsignal-dist
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/libsignal/dist/package
          key: libsignal-dist-${{ runner.os }}-binaryen${{ env.BINARYEN_VERSION }}-${{ steps.libsignal-rev.outputs.rev }}-${{ hashFiles('web/libsignal/build.sh', 'web/libsignal/loader.js', 'web/libsignal/loader.d.ts', 'web/libsignal/tsconfig.json', 'web/pnpm-lock.yaml') }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install the Rust toolchain pinned by libsignal
        if: steps.libsignal-dist.outputs.cache-hit != 'true'
        working-directory: web/libsignal/libsignal
        run: |
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal \
            --target wasm32-wasip1 --component rust-src
          rustc --version

      - name: Install protoc and binaryen ${{ env.BINARYEN_VERSION }}
        if: steps.libsignal-dist.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          name="binaryen-version_${BINARYEN_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/$name-x86_64-linux.tar.gz"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.libsignal-dist.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: libsignal-cargo-${{ runner.os }}-${{ hashFiles('web/libsignal/libsignal/Cargo.lock') }}
          restore-keys: |
            libsignal-cargo-${{ runner.os }}-

      - name: Build libsignal (WebAssembly + TypeScript package)
        if: steps.libsignal-dist.outputs.cache-hit != 'true'
        run: bash web/libsignal/build.sh

      - name: libsignal's TypeScript tests against the WebAssembly build
        run: node web/libsignal/test/node.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libsignal-package
          path: |
            web/libsignal/dist/package
            !web/libsignal/dist/package/ts
            !web/libsignal/dist/package/dist/test
          retention-days: 1
          if-no-files-found: error

  build:
    needs: libsignal
    # A fixed image: its clang-18 package compiles ring's C code into the
    # transport's WebAssembly (reproducible builds, web/README.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      sums: ${{ steps.sums.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the transport submodule
        run: git submodule update --init --depth 1 web/transport/webtor-rs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libsignal-package
          path: web/libsignal/dist/package

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install the Rust toolchain pinned by webtor-rs
        working-directory: web/transport/webtor-rs
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --target wasm32-unknown-unknown --component rustfmt,clippy
          rustc --version

      - name: Install wasm-pack ${{ env.WASM_PACK_VERSION }}
        run: |
          name="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/$name.tar.gz"
          echo "$WASM_PACK_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      # One clang version, always: ring's C code is part of the transport's
      # WebAssembly, which must not change with the runner image
      # (reproducible builds, scripts/verify-site.sh).
      - name: Select clang ${{ env.CLANG_VERSION }} and llvm-ar for ring (C code compiled to wasm32)
        run: |
          if ! command -v "clang-$CLANG_VERSION" || ! command -v "llvm-ar-$CLANG_VERSION"; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "clang-$CLANG_VERSION" "llvm-$CLANG_VERSION"
          fi
          echo "CC_wasm32_unknown_unknown=clang-$CLANG_VERSION" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=llvm-ar-$CLANG_VERSION" >> "$GITHUB_ENV"
          "clang-$CLANG_VERSION" --version

      - name: Install the Rust toolchain for the search tokenizer
        working-directory: web/sql/tokenizer
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target wasm32-wasip1
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            web/sql/dist/sqlite3mc
            web/sql/tokenizer/target
          key: sql-${{ runner.os }}-${{ hashFiles('web/sql/build.sh', 'web/sql/tokenizer/Cargo.lock', 'web/sql/tokenizer/Cargo.toml', 'web/sql/tokenizer/rust-toolchain.toml') }}

      - name: Install brotli
        run: command -v brotli || (sudo apt-get update && sudo apt-get install -y --no-install-recommends brotli)

      - id: transport-rev
        run: echo "rev=$(git -C web/transport/webtor-rs rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/.wasm-pack
            web/transport/webtor-rs/target
          key: transport-${{ runner.os }}-${{ hashFiles('web/transport/webtor-rs/Cargo.lock', 'web/transport/webtor-rs/rust-toolchain.toml') }}-${{ steps.transport-rev.outputs.rev }}
          restore-keys: |
            transport-${{ runner.os }}-${{ hashFiles('web/transport/webtor-rs/Cargo.lock', 'web/transport/webtor-rs/rust-toolchain.toml') }}-

      - name: Build the transport (webtor-rs to WASM)
        run: bash web/transport/build.sh

      # Same code plus webtor's test-relay feature, for the end-to-end tests
      # only (web/e2e); never part of the site.
      - name: Build the transport's end-to-end test variant
        run: bash web/transport/build.sh --test-relay

      # Desktop's own dependencies (repository root) for the web app: no
      # install scripts, so no Electron download and no native builds.
      - id: desktop-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.desktop-store.outputs.path }}
          key: desktop-pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            desktop-pnpm-store-${{ runner.os }}-

      - name: Install Desktop's dependencies (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the web app (Desktop's renderer and SQL worker for the browser)
        run: bash web/renderer/build.sh

      - name: node:crypto shim against Node's node:crypto
        run: node web/renderer/test/crypto-shim.mjs

      # Consensus, authority certificates and every microdescriptor, fetched
      # from the directory authorities; verified by the Rust tests below and
      # again by build-site.sh (the client verifies it too).
      - name: Fetch the Tor directory snapshot
        run: bash web/transport/webtor-rs/scripts/fetch-consensus.sh web/dist/tor-directory

      - name: Tor directory verification and circuit tests (native, on that snapshot)
        working-directory: web/transport/webtor-rs
        env:
          WEBTOR_TEST_DIRECTORY: ${{ github.workspace }}/web/dist/tor-directory
        run: cargo test --locked -p webtor --lib -- directory circuit

      - name: Parallel ranged downloads (unit tests)
        run: node --test web/transport/test/ranged.test.mjs

      - name: Build the site (verifies the snapshot, adds SHA256SUMS)
        run: bash web/scripts/build-site.sh --tor-dir web/dist/tor-directory

      - id: sums
        run: echo "digest=$(sha256sum web/dist/site/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      - name: The site contains no test-only code
        run: |
          if grep -rlE 'openRelay|relay-carrier|web-e2e-config|ws://127\.0\.0\.1' web/dist/site; then
            echo '::error::test-only relay code in the site'
            exit 1
          fi
          # The measurement page (transport-test/perf.*) is served by its runner only.
          if ls web/dist/site/test/perf.* 2>/dev/null || grep -rl 'ACTION hide' web/dist/site; then
            echo '::error::the transport measurement page is in the site'
            exit 1
          fi

      - name: Select the browsers for the tests
        run: |
          echo "CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          echo "FIREFOX=$(command -v firefox)" >> "$GITHUB_ENV"

      - name: Tor directory verification in the browser (the snapshot and tampered copies)
        run: node web/transport-test/run.mjs 'only=directory'

      - name: Transport checks, local (Snowflake WebSocket)
        run: node web/transport-test/run.mjs 'suites=ws&only=basic,upload'

      - name: Transport checks, local, Firefox
        env:
          BROWSER: firefox
        run: node web/transport-test/run.mjs 'suites=ws&only=basic'

      # Real Tor speed varies a lot between circuits and over the day: a
      # record for the logs, never a reason to fail the build.
      - name: Transport measurements, local (report only)
        continue-on-error: true
        timeout-minutes: 10
        env:
          RUNS: '1'
          SIZE_MB: '8'
        run: node web/transport-test/perf.mjs

      # The bridge connection is black-holed (a local proxy stops forwarding
      # without closing it): it must be noticed within 35 s, an idle one kept.
      - name: Transport liveness, local
        env:
          LIVENESS: '1'
        run: node web/transport-test/run.mjs 'suites=ws&only=liveness'

      - name: libsignal checks, local (WebAssembly under the site's CSP)
        run: node web/libsignal/check/run.mjs

      - name: Storage test, local (encrypted database in the browser)
        run: node web/sql/test/run.mjs

      - name: File system test, local (the renderer's node:fs on the origin private file system)
        run: node web/renderer/test/fs-shim.mjs

      - name: Web app boot, local (to the link QR code, decoded)
        run: node web/renderer/run.mjs

      - name: Web app boot, local, Firefox
        env:
          BROWSER: firefox
        run: node web/renderer/run.mjs

      - name: Service worker, local (cache, offline, updates only with the user's consent, manifest)
        run: node web/sw/test/run.mjs

      - name: App shell, local (database error screens, wiped data, a hung second window)
        run: |
          node web/shell/test/device-name.mjs
          node web/shell/test/run.mjs

      - name: Network layer checks, local (WebNet and HTTPS through Tor against Signal)
        run: node web/net/test/run.mjs

      # The app linked to Desktop's mock server (packages/mock-server), reached
      # through a local relay instead of Tor: link, sync, receive, send,
      # reload, link-and-sync, notifications, the debug log view, attachments,
      # linking while the relay drops or stalls every connection, and a
      # connection that silently stops delivering (about 7 minutes). A
      # separate build (web/dist/app-e2e), not deployed.
      - name: Build the end-to-end test variant of the app
        run: node web/renderer/build.mjs --e2e

      - name: End-to-end tests against Desktop's mock server
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          node web/e2e/run.mjs 2>&1 | tee "$E2E_ARTIFACTS/e2e.log"

      # The same scenarios in Firefox (WebDriver BiDi), about 9 minutes.
      - name: End-to-end tests against Desktop's mock server, Firefox
        env:
          BROWSER: firefox
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-firefox
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          node web/e2e/run.mjs 2>&1 | tee "$E2E_ARTIFACTS/e2e.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/e2e-firefox
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  live-smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: web

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Select the browser for the test
        run: echo "CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      # The deployed files are the files this run built: same SHA256SUMS,
      # and every file matches it.
      - name: Deployed files, live site
        env:
          BUILT_SUMS: ${{ needs.build.outputs.sums }}
        run: |
          # The CDN may serve the previous deployment for a few minutes.
          for attempt in $(seq 1 20); do
            live=$(curl -sSf -H 'Cache-Control: no-cache' "${LIVE_URL}SHA256SUMS" | sha256sum | cut -c1-64)
            [ "$live" = "$BUILT_SUMS" ] && break
            echo "attempt $attempt: live SHA256SUMS $live, built $BUILT_SUMS"
            sleep 30
          done
          if [ "$live" != "$BUILT_SUMS" ]; then
            echo "::error::the live site's SHA256SUMS is not this build's"
            exit 1
          fi
          bash web/scripts/verify-site.sh "$LIVE_URL" --deployed-only --work-dir "$RUNNER_TEMP/verify"

      - name: libsignal checks, live site
        run: node web/libsignal/check/run.mjs "$LIVE_URL"

      - name: Web app boot, live site (to the link QR code, decoded)
        run: node web/renderer/run.mjs "$LIVE_URL"
